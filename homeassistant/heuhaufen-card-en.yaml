# Heuhaufen - example card for a Home Assistant dashboard (needs MQTT, see README.txt)
#
# Insert: edit dashboard -> add card -> "Manual" at the very bottom -> paste everything from "type:" on.
# Replace "computername" everywhere with your own computer name in lower case (special characters become _),
# for a second graphics card make a copy with "gpu_1". HA shows the exact entity IDs at the device "Heuhaufen ... GPU 0".
# The entity IDs below fit a Home Assistant whose dashboard ran in English when the device was created
# (HA builds them from device name + sensor name, e.g. "Heuhaufen PC GPU 0" + "Speed").
# The card_mod blocks (border colour, progress bar, hit box) need card-mod from HACS; delete them otherwise.
# Adjust the gauge ranges (speed 1000-2000 M/s, power up to 200 W) to your own graphics card.
# When the dashboard is closed, only the header card stays visible.

type: vertical-stack
cards:
  # Hit: only visible when a found*.txt exists - the key is NEVER sent to HA
  - type: conditional
    conditions:
      - condition: state
        entity: binary_sensor.heuhaufen_computername_gpu_0_hit
        state: "on"
    card:
      type: markdown
      content: |
        ## HIT
        **Send nothing, nothing to the internet, no AI.**
        Follow HIT-Emergency-Plan.md offline.
      card_mod:
        style: |
          ha-card { background: #7f0000; color: #fff; border: 2px solid #ff5252; }

  # Header: state, share, speed, time left, last message, percent - the bar is drawn by card_mod
  # (the markdown card strips style attributes, so card_mod paints it as ::before/::after at the bottom of the card).
  - type: markdown
    content: |
      {% set p = 'heuhaufen_computername_gpu_0' %}
      {% set z = states('sensor.' ~ p ~ '_state') %}
      {% set f = states('sensor.' ~ p ~ '_share_progress') | float(0) %}
      {% set r = states('sensor.' ~ p ~ '_share_time_left') %}
      {% set tage = (r | float(0)) / ({'s': 86400, 'min': 1440, 'h': 24}.get(state_attr('sensor.' ~ p ~ '_share_time_left', 'unit_of_measurement'), 1)) %}
      {% set t = states('sensor.' ~ p ~ '_speed') %}
      {% set m = states('sensor.' ~ p ~ '_message') %}
      ### Heuhaufen · Puzzle 71 · GPU 0
      {% set sp = states('sensor.' ~ p ~ '_search_program') %}
      **{{ z }}** · Share {{ states('sensor.' ~ p ~ '_share') }}{% if sp not in ['unknown', 'unavailable'] %} · {{ sp }}{% endif %}

      {% if t not in ['unknown', 'unavailable'] and r not in ['unknown', 'unavailable'] %}
      {{ t }} MKey/s · {{ '%.1f' | format(tage) }} days left · done around {{ (now() + timedelta(days = tage)).strftime('%m/%d %H:%M') }}
      {% else %}
      Dashboard not open
      {% endif %}
      {% if m not in ['', 'unknown', 'unavailable'] %}
      <font color="#9e9e9e">{{ m }}</font>
      {% endif %}

      **{{ '%.3f' | format(f) }} %** of the share searched
    card_mod:
      style: |
        {% set f = states('sensor.heuhaufen_computername_gpu_0_share_progress') | float(0) %}
        {% set z = states('sensor.heuhaufen_computername_gpu_0_state') %}
        {% if z in ['searching', 'sucht'] %}{% set farbe = 'var(--success-color, #43a047)' %}
        {% elif z in ['HIT', 'TREFFER'] %}{% set farbe = '#ff5252' %}
        {% elif z in ['crashed', 'Absturz', 'unavailable', 'unknown'] %}{% set farbe = 'var(--error-color, #db4437)' %}
        {% elif z in ['ended', 'beendet'] %}{% set farbe = 'var(--disabled-color, #9e9e9e)' %}
        {% else %}{% set farbe = 'var(--warning-color, #ffa600)' %}
        {% endif %}
        ha-card {
          position: relative;
          border-left: 6px solid {{ farbe }};
          padding-bottom: 30px;
        }
        ha-card::before {
          content: "";
          position: absolute; left: 16px; right: 16px; bottom: 16px; height: 10px;
          border-radius: 5px;
          background: rgba(127, 127, 127, 0.25);
        }
        ha-card::after {
          content: "";
          position: absolute; left: 16px; bottom: 16px; height: 10px;
          width: calc((100% - 32px) * {{ (f / 100) | round(5) }});
          border-radius: 5px;
          background: linear-gradient(90deg, rgba(255, 255, 255, 0.15), {{ farbe }});
          background-color: {{ farbe }};
          box-shadow: 0 0 8px {{ farbe }};
        }

  # Everything else only while the dashboard is open (speed not "unavailable")
  - type: conditional
    conditions:
      - condition: state
        entity: sensor.heuhaufen_computername_gpu_0_speed
        state_not: unavailable
    card:
      type: vertical-stack
      cards:
        # Gauges
        - type: horizontal-stack
          cards:
            - type: gauge
              entity: sensor.heuhaufen_computername_gpu_0_speed
              name: Speed
              unit: M/s          # "MKey/s" is too long for the gauge, the number would get tiny
              min: 1000
              max: 2000
              needle: true
              severity:
                red: 1000
                yellow: 1400
                green: 1600
            - type: gauge
              entity: sensor.heuhaufen_computername_gpu_0_temperature
              name: Temperature
              min: 30
              max: 90
              needle: true
              severity:
                green: 30
                yellow: 78
                red: 84
            - type: gauge
              entity: sensor.heuhaufen_computername_gpu_0_power
              name: Power
              min: 0
              max: 200
              needle: true
              severity:
                green: 0
                yellow: 170
                red: 190

        # Switches and values
        - type: entities
          state_color: true
          entities:
            - entity: switch.heuhaufen_computername_gpu_0_search
              name: Search
            - entity: switch.heuhaufen_computername_gpu_0_auto_pause
              name: Auto pause
            - entity: switch.heuhaufen_computername_gpu_0_web_page
              name: Web page
            - type: divider
            # only with $OllamaApi: - entity: binary_sensor.heuhaufen_computername_gpu_0_ollama_busy
            - entity: sensor.heuhaufen_computername_gpu_0_fan
              name: Fan
            - entity: sensor.heuhaufen_computername_gpu_0_utilization
              name: Utilization
            - entity: sensor.heuhaufen_computername_gpu_0_vram_other
              name: VRAM other
            - entity: sensor.heuhaufen_computername_gpu_0_session_energy
              name: Energy since start

        # History (speed and temperature have different units -> two graphs below each other)
        - type: history-graph
          title: History 24 h
          hours_to_show: 24
          entities:
            - entity: sensor.heuhaufen_computername_gpu_0_speed
              name: Speed
            - entity: sensor.heuhaufen_computername_gpu_0_temperature
              name: Temperature
